<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Founder Tycoon</title>
<style>
  :root{--bg:#161821;--panel:#20232f;--line:#2f3445;--text:#e9e7f2;--muted:#8d92a8;--accent:#7c9cff;--good:#3fbf8a;--bad:#e8705f;--card:#262a38;--field:#2a2e3d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
  canvas{border-radius:8px;box-shadow:0 12px 50px #000a;cursor:pointer}
  #hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}
  #toasts{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:340px}
  .toast{background:#262a38ee;border:1px solid var(--line);border-left:4px solid var(--accent);padding:7px 11px;border-radius:8px;font-size:13px;animation:tin .25s ease-out;transition:opacity .5s}
  .toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}
  @keyframes tin{from{transform:translateX(-20px);opacity:0}}
  #side{width:360px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
  header{padding:12px 14px 8px;display:flex;align-items:center;gap:8px}
  header h1{font-size:15px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font-variant-numeric:tabular-nums;font-weight:600;background:var(--field);padding:3px 8px;border-radius:6px;font-size:12.5px}
  .diff{font-size:11px;padding:2px 7px;border-radius:9px;font-weight:700;color:#111;white-space:nowrap}
  .d-casual{background:#8de0b0}.d-student{background:#9db4ff}.d-challenger{background:#ffc27e}.d-founder{background:#ff9a8a}.d-custom{background:#d3b4ff}
  .top{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;padding:0 14px 10px}
  .top div{background:var(--card);border-radius:8px;padding:6px 9px;font-size:11px;color:var(--muted)}
  .top b{display:block;color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
  .controls{display:flex;gap:4px;padding:0 14px 10px}
  .controls button{flex:1;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 0;cursor:pointer;font-size:13px}
  .controls button.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
  .tabs{display:flex;gap:4px;padding:0 10px 8px;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;white-space:nowrap;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 0;cursor:pointer;font-size:12px}
  .tabs button.on{background:var(--field);color:var(--text)}
  .tabs button:last-child{flex:0 0 34px}
  #panel{flex:1;overflow-y:auto;padding:4px 14px 16px;font-size:12.5px;line-height:1.45}
  #panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;margin:2px 0}.kv span:first-child{color:var(--muted)}
  .kv b{font-variant-numeric:tabular-nums;text-align:right}
  .bar{height:7px;background:var(--field);border-radius:4px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;transition:width .4s}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .grid2>div{background:var(--card);border-radius:8px;padding:6px 9px;color:var(--muted);font-size:11px}.grid2 b{display:block;color:var(--text);font-size:14px}
  .btn{background:var(--accent);color:#111;border:0;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer;font-size:12.5px}
  .btn.sec{background:var(--field);color:var(--text);border:1px solid var(--line)}
  .btn.red{background:#3a2a2c;color:#ffb3a6}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;background:var(--card);margin-bottom:5px;cursor:pointer;border:1px solid transparent}
  .row.sel{border-color:var(--accent)}
  .dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px}
  .row .grow{flex:1;min-width:0}.row small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini{display:flex;gap:4px;margin-top:3px}.mini .bar{flex:1;margin:0;height:5px}
  .cand{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:8px;padding:7px 8px;margin-bottom:5px}
  .stars{color:#f2c94c;letter-spacing:-1px;font-size:11px}
  .item{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:8px;padding:7px 9px;margin-bottom:5px}
  .item .ic{font-size:20px}.item small{display:block;color:var(--muted);font-size:11px}
  .selcard{background:#232a40;border:1px solid #3b4a7a;border-radius:10px;padding:10px;margin:8px 0}
  .selcard .acts{display:flex;gap:6px;margin-top:8px}
  input[type=range]{width:100%}
  select,input[type=text],input[type=number],textarea{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;width:100%}
  textarea{resize:vertical;min-height:54px}
  .log p{margin:0 0 5px}.log .t{color:#5d6278;font-size:10.5px;margin-right:4px}
  .note{color:var(--muted);font-size:11.5px}
  .pitch{background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}
  .pitch h4{margin:0 0 2px;font-size:16px}.pitch .tag{color:var(--accent);font-size:11.5px}
  .pitch p{margin:6px 0}.pitch .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-top:8px}
  #modal,#home{position:fixed;inset:0;background:#0b0c12cc;display:flex;align-items:center;justify-content:center;z-index:10}
  #modal[hidden],#home[hidden]{display:none}
  #modal{z-index:11}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;width:min(460px,92vw);max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px #000c}
  .box h2{margin:0 0 8px;font-size:19px}.box p{color:#cfd2e2;font-size:14px;line-height:1.5}
  .mbtns{display:flex;flex-direction:column;gap:7px;margin-top:14px}.mbtns .btn{padding:9px;font-size:13.5px}
  #home .box{width:min(720px,95vw)}
  .logo{font-size:30px;font-weight:800;letter-spacing:.5px;margin:0}.logo span{color:var(--accent)}
  .sub{color:var(--muted);margin:2px 0 16px}
  .proj{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:9px 11px;margin-bottom:6px}
  .proj .grow{flex:1;min-width:0}.proj small{color:var(--muted);display:block;font-size:11.5px}
  .form label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .form h4{margin:18px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent)}
  .presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
  .presets label{display:block;background:var(--card);border:2px solid transparent;border-radius:9px;padding:8px 10px;cursor:pointer;font-size:13px}
  .presets input{display:none}.presets label:has(input:checked){border-color:var(--accent)}
  .presets small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  details.adv{background:#1b1e29;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
  details.adv summary{cursor:pointer;font-weight:600;font-size:13px}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
  .sgrid .s{display:flex;flex-direction:column;gap:3px;padding:6px 0}
  .sgrid .s>span{font-size:12px}.sgrid .s small{display:block;color:var(--muted);font-size:10.5px}
  .sgrid .chk{flex-direction:row;align-items:center;gap:8px}
  .sgrid h5{grid-column:1/-1;margin:10px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
  .multbox{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:13px}
  .multbox b{font-size:18px;color:var(--accent)}
  table.rank{width:100%;border-collapse:collapse;font-size:12.5px}
  table.rank td,table.rank th{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left}
  table.rank th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
  table.rank td.n{text-align:right;font-variant-numeric:tabular-nums}
  .hometabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .rfilter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.rfilter .btn{padding:3px 9px;font-size:11.5px}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="toasts"></div><div id="hint">Click a team member for details · Space = pause</div></div>
<aside id="side">
  <header><h1 id="cname">—</h1><span id="diffTag" class="diff"></span><span class="pill" data-v="day"></span><span class="pill" data-v="clock"></span></header>
  <div class="top">
    <div>Cash<b data-v="cash"></b></div>
    <div>MRR<b data-v="mrr"></b></div>
    <div>Customers<b data-v="cust"></b></div>
  </div>
  <div class="controls">
    <button id="pause">⏸</button>
    <button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="4">4x</button>
    <button id="menu" title="Main menu">☰ Menu</button>
  </div>
  <div class="tabs">
    <button data-tab="company" class="on">📊 Company</button><button data-tab="team">👥 Team</button><button data-tab="office">🏗️ Office</button><button data-tab="pitch">💼 Pitch</button><button data-tab="log">📜</button>
  </div>
  <div id="panel"></div>
</aside>
<div id="modal" hidden><div class="box"><h2 id="mt"></h2><div id="mb"></div><div class="mbtns" id="mbtns"></div></div></div>
<div id="home"><div class="box" id="homebox"></div></div>
<script>
// =====================================================================
// GAME CONFIG
// =====================================================================
const GOAL = 10e6;                       // win: $10M valuation
const STORE = 'founder-tycoon-projects';

// Approximate cost profiles (all in USD). Not tax advice — game approximations.
const COUNTRIES = {
  global: { n: '🌍 Global average', sal: .35, vat: .15, pay: .15, inc: .22, rent: .5, loan: .12 },
  us: { n: '🇺🇸 United States', sal: 1, vat: .07, pay: .2, inc: .21, rent: 1.2, loan: .09 },
  uk: { n: '🇬🇧 United Kingdom', sal: .75, vat: .2, pay: .15, inc: .25, rent: 1.1, loan: .08 },
  es: { n: '🇪🇸 Spain', sal: .45, vat: .21, pay: .3, inc: .25, rent: .6, loan: .07 },
  mx: { n: '🇲🇽 Mexico', sal: .25, vat: .16, pay: .25, inc: .3, rent: .35, loan: .14 },
  br: { n: '🇧🇷 Brazil', sal: .3, vat: .17, pay: .28, inc: .34, rent: .4, loan: .16 },
  cl: { n: '🇨🇱 Chile', sal: .33, vat: .19, pay: .07, inc: .27, rent: .45, loan: .12 },
  in: { n: '🇮🇳 India', sal: .15, vat: .18, pay: .13, inc: .25, rent: .25, loan: .11 },
};

// Player-type presets. Any change in Advanced settings turns the project into "custom".
const PRESETS = {
  casual:     { n: '🎮 Casual', desc: 'Just for fun. Generous market, no taxes, forgiving.', cfg: { country: 'global', cash: 60000, vat: false, payroll: false, incTax: false, cogs: true, lead: 1.5, conv: 1.25, churn: .7, market: 1.5, events: 'normal', bad: .3, grace: 5, loans: true, quitting: false, daySec: 45 } },
  student:    { n: '📚 Student', desc: 'Learn how a business works. Balanced, no taxes.', cfg: { country: 'global', cash: 30000, vat: false, payroll: false, incTax: false, cogs: true, lead: 1, conv: 1, churn: 1, market: 1, events: 'normal', bad: .5, grace: 3, loans: true, quitting: true, daySec: 45 } },
  challenger: { n: '🔥 Challenger', desc: 'Tight cash, tough market, taxes on.', cfg: { country: 'global', cash: 15000, vat: true, payroll: true, incTax: true, cogs: true, lead: .75, conv: .85, churn: 1.3, market: .8, events: 'high', bad: .65, grace: 3, loans: true, quitting: true, daySec: 45 } },
  founder:    { n: '🚀 Founder', desc: 'Test a real idea: real-world costs and taxes for your country. Eligible for the investor portal.', cfg: { country: 'us', cash: 25000, vat: true, payroll: true, incTax: true, cogs: true, lead: .6, conv: .75, churn: 1.5, market: .6, events: 'normal', bad: .6, grace: 0, loans: true, quitting: true, daySec: 45 } },
};
const PRESET_LABEL = { ...Object.fromEntries(Object.entries(PRESETS).map(([k, p]) => [k, p.n])), custom: '⚙️ Custom' };

// Every industry runs on the same engine with different parameters.
const INDUSTRIES = {
  saas: { n: 'Software / App (subscription)', ref: 30, leads: 1, cogs: .1, churn: .003, market: 2500, tickets: .08, rent: 1, unit: '/mo',
    ver: v => v === 0 ? 'MVP v0.1' : `v${v}.0`, prod: 'release',
    roles: { dev: 'Developer', design: 'UX Designer', sales: 'Sales', mkt: 'Marketing', support: 'Support' } },
  ecommerce: { n: 'Online store', ref: 50, leads: .8, cogs: .55, churn: .009, market: 5000, tickets: .05, rent: 1, unit: '/mo per customer',
    ver: v => v === 0 ? 'Launch catalog' : `Catalog ${v + 1}`, prod: 'catalog',
    roles: { dev: 'Product', design: 'Designer', sales: 'Sales', mkt: 'Marketing', support: 'Fulfillment' } },
  food: { n: 'Café / restaurant', ref: 45, leads: .9, cogs: .38, churn: .007, market: 1800, tickets: .04, rent: 1.6, unit: '/mo per regular',
    ver: v => v === 0 ? 'Opening menu' : `Menu ${v + 1}`, prod: 'menu',
    roles: { dev: 'Chef', design: 'Interior', sales: 'Front of house', mkt: 'Marketing', support: 'Service' } },
  services: { n: 'Agency / B2B services', ref: 900, leads: .1, cogs: .25, churn: .0035, market: 160, tickets: .5, rent: 1, unit: '/mo per client',
    ver: v => v === 0 ? 'First offer' : `Playbook ${v}`, prod: 'playbook',
    roles: { dev: 'Consultant', design: 'Designer', sales: 'Business dev', mkt: 'Marketing', support: 'Account mgr' } },
};

const ROLES = {   // base = US monthly salary
  dev:     { e: '💻', c: '#4f8ef7', base: 9000, verb: 'Building the product', bub: ['⌨️', '🐛', '✅', '🔧'] },
  design:  { e: '🎨', c: '#e86a92', base: 7500, verb: 'Polishing the experience', bub: ['🎨', '✏️', '✨'] },
  sales:   { e: '🤝', c: '#3fbf8a', base: 6500, verb: 'Talking to leads', bub: ['📞', '📧', '🤝'] },
  mkt:     { e: '📣', c: '#f2a632', base: 7000, verb: 'Running campaigns', bub: ['📣', '📈', '📸'] },
  support: { e: '🎧', c: '#a77bf0', base: 4500, verb: 'Helping customers', bub: ['🎧', '💬', '👍'] },
};
const roleName = r => INDUSTRIES[S.industry].roles[r];

const LEVELS = [   // US rent per month (scaled by country)
  { n: 'Garage', rent: 1200, cost: 0 },
  { n: 'Office', rent: 6000, cost: 25000 },
  { n: 'Corporate floor', rent: 24000, cost: 100000 },
];

const NAMES = ['Alex', 'Sam', 'Jordan', 'Maya', 'Leo', 'Priya', 'Noah', 'Sofia', 'Kenji', 'Ava', 'Mateo', 'Zoe', 'Omar', 'Lucia', 'Ethan', 'Chloe', 'Ravi', 'Emma', 'Diego', 'Nina', 'Liam', 'Aisha', 'Tom', 'Isla', 'Felix', 'Mia', 'Hugo', 'Yara'];
const SKINS = ['#f1c7a5', '#d9a67e', '#a9744f', '#f6d3b8', '#8d5a3b'];
const HAIRS = ['#3b2418', '#1c1c22', '#c0602a', '#5a3d26', '#d8b24a', '#77777f'];
const STYLES = ['long', 'short', 'bun', 'curly'];

// =====================================================================
// MAP
// =====================================================================
const T = 24, COLS = 32, ROWS = 20, W = COLS * T, H = ROWS * T;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ZONES = [{ x0: 1, x1: 10 }, { x0: 12, x1: 20 }, { x0: 22, x1: 30 }];
const DOOR = [5, 18];
const DESKS = [];
[2, 13, 23].forEach((bx, z) => {
  DESKS.push({ x: bx, y: 3, seat: [bx + 1, 5], face: 'up', z }, { x: bx + 4, y: 3, seat: [bx + 5, 5], face: 'up', z },
    { x: bx, y: 12, seat: [bx + 1, 11], face: 'down', z }, { x: bx + 4, y: 12, seat: [bx + 5, 11], face: 'down', z });
});
const poi = (tile, face, rate, mor, emo, doing, sit) => ({ tile, face, rate, mor, emo, doing, sit, busy: null });
const ITEMS = {
  cooler:  { n: 'Water cooler', ic: '💧', cost: 0, z: 0, furn: [{ t: 'cooler', x: 1, y: 2, w: 1, h: 1 }], pois: [poi([1, 3], 'up', 45, 0, '💧', 'Getting water')] },
  coffee:  { n: 'Coffee machine', ic: '☕', cost: 500, z: 0, mor: 3, desc: 'Much faster energy recovery.', furn: [{ t: 'coffee', x: 9, y: 2, w: 2, h: 1 }], pois: [poi([9, 3], 'up', 95, 2, '☕', 'Grabbing a coffee')] },
  board:   { n: 'Whiteboard', ic: '📝', cost: 250, z: 0, desc: '+10% product and design progress.', furn: [], pois: [] },
  sofa:    { n: 'Sofa', ic: '🛋️', cost: 1200, z: 1, mor: 4, desc: 'Comfy breaks: energy and morale.', furn: [{ t: 'couch', x: 14, y: 15, w: 4, h: 1 }], pois: [poi([15, 16], 'down', 110, 5, '😌', 'Resting', true), poi([16, 16], 'down', 110, 5, '📱', 'Resting', true)] },
  snacks:  { n: 'Snack machine', ic: '🍫', cost: 1800, z: 1, mor: 4, desc: 'Energy plus a little happiness.', furn: [{ t: 'vending', x: 20, y: 14, w: 1, h: 2 }], pois: [poi([19, 15], 'right', 75, 4, '🍫', 'Having a snack')] },
  ping:    { n: 'Ping-pong table', ic: '🏓', cost: 3000, z: 2, mor: 8, desc: 'Team morale skyrockets.', furn: [{ t: 'pingpong', x: 24, y: 15, w: 5, h: 2 }], pois: [poi([23, 15], 'right', 55, 12, '🏓', 'Playing ping-pong'), poi([29, 15], 'left', 55, 12, '🏓', 'Playing ping-pong')] },
};
const PLANT_SPOTS = [[1, 18], [10, 18], [12, 2], [20, 18], [22, 2], [30, 18]];
const zoneOpen = z => z < S.level;

const solid = [...Array(ROWS)].map(() => Array(COLS).fill(false));
function rebuildSolid() {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) solid[y][x] = y < 2 || y === ROWS - 1 || x === 0 || x === COLS - 1;
  for (const wx of [11, 21]) for (let y = 2; y < ROWS - 1; y++) solid[y][wx] = !((y === 8 || y === 9) && zoneOpen(wx === 11 ? 1 : 2));
  ZONES.forEach((z, i) => { if (!zoneOpen(i)) for (let y = 2; y < ROWS - 1; y++) for (let x = z.x0; x <= z.x1; x++) solid[y][x] = true; });
  const blk = f => { for (let j = f.y; j < f.y + f.h; j++) for (let i = f.x; i < f.x + f.w; i++) solid[j][i] = true; };
  DESKS.forEach(d => { if (zoneOpen(d.z)) blk({ x: d.x, y: d.y, w: 3, h: 2 }); });
  activeFurn().forEach(blk);
}
function activeFurn() {
  const out = [];
  for (const [k, it] of Object.entries(ITEMS)) if (S.items[k] && zoneOpen(it.z)) out.push(...it.furn);
  PLANT_SPOTS.slice(0, S.plants).forEach(([x, y]) => out.push({ t: 'plant', x, y, w: 1, h: 1 }));
  return out;
}
const activePois = () => Object.entries(ITEMS).filter(([k, it]) => S.items[k] && zoneOpen(it.z)).flatMap(([, it]) => it.pois);

// =====================================================================
// UTILS
// =====================================================================
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => {
  const a = Math.abs(n), s = n < 0 ? '−$' : '$';
  if (a >= 1e9) return s + (a / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return s + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e4) return s + (a / 1e3).toFixed(1) + 'k';
  return s + Math.round(a).toLocaleString('en-US');
};
const pct = v => Math.round(v * 100) + '%';
const rint = x => Math.floor(x) + (Math.random() < x - Math.floor(x) ? 1 : 0);   // stochastic rounding

// =====================================================================
// STATE
// =====================================================================
let S = null, actors = [], selectedId = null, paused = false, speed = 1, tab = 'company', dirty = true;
let floats = [], timers = [], modalQ = [], nightT = 0;
const I = () => INDUSTRIES[S.industry], CFG = () => S.cfg, CTRY = () => COUNTRIES[S.cfg.country];
const minPerSec = () => 540 / S.cfg.daySec;

// Score multiplier derived from the settings, so custom games rank fairly.
function multOf(c) {
  const ct = COUNTRIES[c.country];
  const m = Math.pow(30000 / c.cash, .3) * Math.pow(c.lead, -.7) * Math.pow(c.conv, -.9) * Math.pow(c.churn, .6) * Math.pow(c.market, -.3)
    * (c.vat ? 1.12 : 1) * (c.payroll ? 1.08 : 1) * (c.incTax ? 1.06 : 1) * (c.cogs ? 1 : .85)
    * (1 + (c.bad - .5) * .6) * (c.grace === 0 ? 1.1 : c.grace >= 5 ? .9 : 1) * (c.loans ? 1 : 1.05)
    * ({ off: .8, low: .9, normal: 1, high: 1.08 }[c.events]) * Math.pow(ct.sal / .35, .25);
  return Math.round(clamp(m, .25, 6) * 100) / 100;
}
function look() { return { skin: pick(SKINS), hair: pick(HAIRS), style: pick(STYLES) }; }

function newProject(f, cfg, preset) {
  S = {
    id: 'p' + Date.now().toString(36), created: Date.now(), name: f.name, founder: f.founder || 'You', pitch: f.pitch, problem: f.problem,
    customer: f.customer, industry: f.industry, preset, cfg, mult: multOf(cfg), realInterest: false,
    day: 1, min: 9 * 60, cash: cfg.cash, price: Math.round(INDUSTRIES[f.industry].ref * .6), customers: 0, pipeline: 0, buzz: 6,
    quality: 12, version: 0, devProg: 0, polish: 0, supportPts: 0, coverage: 1, sat: .6, equity: 100,
    level: 1, items: { cooler: true }, plants: 0, staff: [], candidates: [], log: [], hist: [], milestones: {}, offers: {}, once: {},
    nextEvent: 4, debtDays: 0, last: null, won: false, over: false, nextId: 1, totalRev: 0, raised: 0, best: 0,
    loan: null, taxAcc: 0, taxPaid: 0,
  };
  S.staff.push({ id: 0, name: S.founder, founder: true, role: 'dev', skill: 3, salary: 0, energy: 100, morale: 85, desk: 0, ...look() });
  refreshCandidates();
  log(`🏁 <b>${esc(S.name)}</b> is born. It all starts in a garage.`);
  startProject();
}
function allProjects() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } }
function save() {
  if (!S) return;
  try { const all = allProjects(); all[S.id] = S; localStorage.setItem(STORE, JSON.stringify(all)); localStorage.setItem(STORE + '-last', S.id); } catch { }
}
function loadProject(id) { const p = allProjects()[id]; if (p) { S = p; startProject(); } }
function startProject() {
  Object.values(ITEMS).forEach(it => it.pois.forEach(p => p.busy = null));
  rebuildSolid();
  actors = S.staff.map(e => new Actor(e, false));

function log(html) { S.log.unshift({ d: S.day, t: hhmm(), html }); if (S.log.length > 150) S.log.length = 150; if (tab === 'log') dirty = true; }
function toast(text, kind = '') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.innerHTML = text;
  const box = document.getElementById('toasts'); box.appendChild(el);
  while (box.children.length > 5) box.firstChild.remove();

const hhmm = () => { const m = Math.floor(S.min); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

const employees = () => S.staff.filter(e => !e.founder);
const verCost = () => 25 * Math.pow(1.55, S.version);
const fairPrice = () => I().ref * (0.45 + S.quality / 100 * 1.1);
function conv() {
  const base = 0.08 + S.quality / 140, pf = Math.pow(clamp(fairPrice() / S.price, .05, 1.6), 1.6);
  return clamp(base * pf * CFG().conv, .005, .92);
}
const marketSize = () => I().market * CFG().market * (0.4 + S.quality / 60);
function leadsPerDay() {
  const sat = Math.max(.05, 1 - S.customers / marketSize());
  return (2 + S.buzz * .35 + S.customers * .01 * S.sat) * CFG().lead * I().leads * sat;
}
const mrr = () => S.customers * S.price;
const netFactor = () => CFG().vat ? 1 / (1 + CTRY().vat) : 1;             // prices are tax-inclusive
const payroll = () => S.staff.reduce((s, e) => s + e.salary, 0) * (CFG().payroll ? 1 + CTRY().pay : 1);
const rentNow = () => LEVELS[S.level - 1].rent * CTRY().rent * I().rent;
const valuation = () => Math.max(0, mrr() * netFactor() * 12 * (1 - (CFG().cogs ? I().cogs : 0)) * (2.5 + S.quality / 10)) + Math.max(0, S.cash) - (S.loan ? S.loan.bal : 0);
const score = p => Math.round((p.best || 0) * (p.mult || 1) / 1000);
const campaignCost = () => 600 * S.level;
const maxDesks = () => S.level * 4;
const moraleTarget = () => clamp(55 + S.plants * 3 + Object.entries(ITEMS).reduce((s, [k, it]) => s + (S.items[k] && zoneOpen(it.z) ? it.mor || 0 : 0), 0), 0, 95);
const effOf = e => e.skill * (0.6 + e.morale / 250) * (e.energy < 15 ? .5 : 1);
const loanMax = () => Math.round(Math.max(5000, mrr() * netFactor() * 3) / 1000) * 1000;

function newCustomer(a) {
  S.customers++;
  if (a) { a.say('🤝 New customer!', 2); floatText(a, '+' + money(S.price) + '/mo', '#3fbf8a'); }
  milestone();
}
function checkRelease(a) {
  const c = verCost();
  if (S.devProg < c) return;
  const pr = Math.min(1, S.polish / c);
  S.quality = Math.min(99, S.quality + (100 - S.quality) * (0.10 + 0.14 * pr));
  S.devProg -= c; S.polish = 0; S.version++; S.buzz += 6;
  const v = I().ver(S.version);
  if (a) a.say('🚀 Shipped it!', 2.5);
  toast(`🚀 Launched <b>${v}</b> · quality ${Math.round(S.quality)}/100`, 'good');
  log(`🚀 Launched <b>${v}</b> (quality ${Math.round(S.quality)}).`);
  dirty = true; milestone();
}

function endDay() {
  const c = CFG(), acc = {};
  // self-serve: some leads buy without a salesperson
  const self = S.pipeline * .3, won = rint(self * conv() * .6);
  S.customers += won;
  S.pipeline = Math.max(0, (S.pipeline - self) * .8);
  // support → satisfaction
  const tickets = S.customers * I().tickets;
  const cov = tickets < .5 ? 1 : Math.min(1, (S.supportPts + .5) / tickets);
  S.coverage = S.coverage * .6 + cov * .4; S.supportPts = 0;
  S.sat = clamp(.45 * S.quality / 100 + .55 * S.coverage, 0, 1);
  // churn
  const churned = Math.min(S.customers, rint(S.customers * (I().churn + .02 * (1 - S.sat)) * c.churn));
  S.customers -= churned;
  // money
  const gross = mrr() / 30;
  acc.rev = gross * netFactor(); acc.vat = gross - acc.rev;
  acc.cogs = c.cogs ? acc.rev * I().cogs : 0;
  acc.sal = payroll() / 30;
  acc.rent = rentNow() / 30;
  acc.loan = 0;
  if (S.loan) {
    const interest = S.loan.bal * S.loan.rate / 365, pay = Math.min(S.loan.bal + interest, S.loan.daily);
    S.loan.bal += interest - pay; acc.loan = pay; acc.interest = interest;
    if (S.loan.bal < 1) { S.loan = null; log('🏦 Loan fully repaid.'); toast('🏦 Loan repaid', 'good'); }
  }
  const pre = acc.rev - acc.cogs - acc.sal - acc.rent - (acc.interest || 0);
  acc.tax = 0;
  if (c.incTax) {
    S.taxAcc += pre;
    if (S.day % 30 === 0) {
      if (S.taxAcc > 0) { acc.tax = S.taxAcc * CTRY().inc; S.taxPaid += acc.tax; log(`🧾 Paid ${money(acc.tax)} in income tax on ${money(S.taxAcc)} profit (last 30 days).`); }
      S.taxAcc = 0;
    }
  }
  const net = acc.rev - acc.cogs - acc.sal - acc.rent - acc.loan - acc.tax;
  S.cash += net; S.totalRev += acc.rev;
  S.last = { ...acc, net, won, churned, day: S.day };
  S.buzz *= .88;
  S.hist.push(Math.round(mrr())); if (S.hist.length > 60) S.hist.shift();
  // team
  if (c.quitting) for (const e of [...employees()]) {
    if (e.morale < 15 && Math.random() < .5) { log(`😞 <b>${esc(e.name)}</b> quit: morale hit rock bottom.`); toast(`😞 ${esc(e.name)} quit`, 'bad'); fire(e, true); }
  }
  S.staff.forEach(e => e.energy = Math.min(100, e.energy + 70));
  log(`📅 Day ${S.day}: ${money(acc.rev)} revenue · ${money(-(acc.cogs + acc.sal + acc.rent + acc.loan + acc.tax))} costs · ${won ? `+${won} self-serve · ` : ''}${churned ? `−${churned} churned` : 'no churn'}.`);
  // bankruptcy
  if (S.cash < 0) {
    S.debtDays++;
    if (S.debtDays > c.grace) { S.over = true; save(); return gameOver(); }
    toast(`⚠️ Negative cash (${S.debtDays}/${c.grace} days of grace). Cut costs${c.loans ? ' or take a loan' : ''}!`, 'bad');
  } else S.debtDays = 0;
  // new day
  S.day++; S.min = 9 * 60; nightT = 1.6;
  if (S.day % 2 === 0) refreshCandidates();
  investorCheck();
  if (c.events !== 'off' && S.day >= S.nextEvent) {
    randomEvent();
    const [a, b] = { low: [6, 10], normal: [3, 6], high: [2, 4] }[c.events];
    S.nextEvent = S.day + Math.round(rand(a, b));
  }
  milestone();
  dirty = true; save();
}

function milestone() {
  const v = valuation(); if (v > (S.best || 0)) S.best = v;
  const M = [
    ['c1', () => S.customers >= 1, '🎉 First customer!'],
    ['c10', () => S.customers >= 10, '👥 10 customers'],
    ['c100', () => S.customers >= 100, '💯 100 customers'],
    ['c1000', () => S.customers >= 1000, '🏟️ 1,000 customers'],
    ['v1', () => S.version >= 1, '🚀 First launch'],
    ['h1', () => employees().length >= 1, '🧑‍💼 First hire'],
    ['m1', () => mrr() >= 2000, '💵 $2k MRR'],
    ['m10', () => mrr() >= 20000, '💰 $20k MRR'],
    ['val1', () => v >= 2e6, '📈 $2M valuation'],
  ];
  for (const [k, c, t] of M) if (!S.milestones[k] && c()) { S.milestones[k] = S.day; toast(t, 'good'); log('🏅 ' + t); }
  if (!S.won && v >= GOAL) {
    S.won = true; log('🦄 Goal reached!');
    modal('🦄 You made it!', `<p><b>${esc(S.name)}</b> is worth ${money(v)} on day ${S.day}. Your stake: ${money(v * S.equity / 100)} (${S.equity.toFixed(1)}%).</p><p>Your project is on the leaderboard with <b>${score(S)}</b> points. Keep playing to climb higher.</p>`, [{ t: 'Keep growing' }]);
  }
}

function investorCheck() {
  const OFF = [
    { k: 'angel', mrr: 2000, amt: 50000, p: 10, who: 'An angel investor' },
    { k: 'seed', mrr: 12000, amt: 400000, p: 15, who: 'A seed fund' },
    { k: 'seriesA', mrr: 60000, amt: 3e6, p: 20, who: 'A venture capital firm (Series A)' },
  ];
  for (const o of OFF) if (!S.offers[o.k] && mrr() >= o.mrr) {
    S.offers[o.k] = true;
    modal('💼 Investment offer', `<p>${o.who} wants to invest <b>${money(o.amt)}</b> for <b>${o.p}%</b> of ${esc(S.name)}.</p><p class="note">You own ${S.equity.toFixed(1)}%. After the deal you'd own ${(S.equity * (1 - o.p / 100)).toFixed(1)}%.</p>`, [
      { t: `Accept (+${money(o.amt)})`, f() { S.cash += o.amt; S.raised += o.amt; S.equity *= 1 - o.p / 100; log(`💼 Raised ${money(o.amt)} for ${o.p}%.`); } },
      { t: 'Decline and bootstrap', sec: true, f() { log('💼 Declined an investment offer.'); } },

}

function randomEvent() {
  const wantBad = Math.random() < CFG().bad;
  let pool = EVENTS.filter(ev => ev.cond() && !(ev.once && S.once[ev.once]) && !!ev.good !== wantBad);
  if (!pool.length) pool = EVENTS.filter(ev => ev.cond() && !(ev.once && S.once[ev.once]));
  if (!pool.length) return;
  const ev = pick(pool); if (ev.once) S.once[ev.once] = true; ev.run();
}

function genCandidate() {
  const role = pick(Object.keys(ROLES));
  const r = Math.random(), skill = r < .25 ? 1 : r < .55 ? 2 : r < .8 ? 3 : r < .95 ? 4 : 5;
  const salary = Math.round(ROLES[role].base * CTRY().sal * (0.55 + skill * .25) * rand(.9, 1.1) / 10) * 10;
  return { id: S.nextId++, name: pick(NAMES), role, skill, salary, energy: 100, morale: 75, ...look() };
}
function refreshCandidates() { S.candidates = Array.from({ length: 4 }, genCandidate); dirty = true; }
function freeDesk() { const used = new Set(S.staff.map(e => e.desk)); for (let i = 0; i < maxDesks(); i++) if (!used.has(i)) return i; return -1; }
function hire(id) {
  const c = S.candidates.find(x => x.id === id), d = freeDesk(); if (!c || d < 0) return;
  c.desk = d; S.staff.push(c); S.candidates = S.candidates.filter(x => x !== c);
  actors.push(new Actor(c, true));
  log(`🧑‍💼 Hired <b>${esc(c.name)}</b> (${roleName(c.role)}, ${'★'.repeat(c.skill)}).`);
  toast(`👋 ${esc(c.name)} joins the team`, 'good'); dirty = true; milestone(); save();
}
function fire(e, quiet) {
  S.staff = S.staff.filter(x => x !== e);
  const a = actors.find(a => a.emp === e); if (a) a.leave();
  if (selectedId === e.id) selectedId = null;
  if (!quiet) { log(`📤 Let <b>${esc(e.name)}</b> go.`); employees().forEach(o => o.morale -= 5); }
  dirty = true;
}

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const SPEED = 2.6;
function bfs(sx, sy, goal) {
  const prev = new Int32Array(COLS * ROWS).fill(-2), start = sy * COLS + sx, q = [start]; prev[start] = -1;
  for (let h = 0; h < q.length; h++) {
    const k = q[h], x = k % COLS, y = (k / COLS) | 0;
    if (goal(x, y)) { const p = []; let c = k; while (c !== start) { p.push([c % COLS, (c / COLS) | 0]); c = prev[c]; } return p.reverse(); }
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || solid[ny][nx]) continue;
      const nk = ny * COLS + nx; if (prev[nk] !== -2) continue; prev[nk] = k; q.push(nk);
    }
  }
  return null;
}
class Actor {
  constructor(emp, spawn) {
    this.emp = emp; this.path = []; this.phase = 0; this.bubble = null; this.thinkT = rand(2, 6); this.chatT = rand(3, 8); this.sp = 0; this.poi = null;
    if (spawn) { [this.x, this.y] = DOOR; this.dir = 'up'; this.goDesk(); }
    else { const d = DESKS[emp.desk]; [this.x, this.y] = d.seat; this.dir = d.face; this.task = 'desk'; this.state = 'idle'; }
  }
  get tx() { return Math.round(this.x); } get ty() { return Math.round(this.y); }
  say(text, dur, emoji = false) { this.bubble = { text, t: dur, max: dur, emoji }; }
  release() { if (this.poi) { this.poi.busy = null; this.poi = null; } }
  walkTo(x, y) {
    const p = bfs(this.tx, this.ty, (i, j) => i === x && j === y);
    if (!p) { this.state = 'idle'; return false; }
    if (Math.hypot(this.x - this.tx, this.y - this.ty) > .01) p.unshift([this.tx, this.ty]);
    this.path = p; this.state = 'walking'; if (!p.length) this.arrive(); return true;
  }
  goDesk() { this.release(); this.task = 'desk'; this.walkTo(...DESKS[this.emp.desk].seat); }
  goBreak() {
    this.release();
    const free = activePois().filter(p => !p.busy);
    const lonelyPing = ITEMS.ping.pois.some(p => p.busy) && free.find(p => ITEMS.ping.pois.includes(p));
    const choice = lonelyPing && Math.random() < .7 ? lonelyPing
      : free.length ? free.map(p => [p, p.rate + p.mor * 4 + rand(-60, 60)]).sort((a, b) => b[1] - a[1])[0][0] : null;
    if (choice) { choice.busy = this; this.poi = choice; this.task = 'break'; this.walkTo(...choice.tile); }
    else this.wander();
  }
  wander() {
    this.task = 'wander'; this.wanderT = rand(4, 8);
    for (let k = 0; k < 20; k++) {
      const z = ZONES[Math.floor(Math.random() * S.level)], x = Math.floor(rand(z.x0, z.x1 + 1)), y = Math.floor(rand(6, 11));
      if (!solid[y][x] && this.walkTo(x, y)) return;
    }
    this.state = 'idle';
  }
  leave() { this.release(); this.task = 'leave'; if (!this.walkTo(...DOOR)) this.gone = true; }
  arrive() {
    this.state = 'idle'; this.path = [];
    if (this.task === 'desk') this.dir = DESKS[this.emp.desk].face;
    else if (this.task === 'break') { this.dir = this.poi.face; this.say(this.poi.emo, 2.5, true); }
    else if (this.task === 'leave') this.gone = true;
  }
  update(dt, h) {
    const e = this.emp;
    if (this.bubble && (this.bubble.t -= dt) <= 0) this.bubble = null;
    if (this.state === 'walking') { e.energy = Math.max(0, e.energy - 4 * h); return this.move(dt); }
    if (this.task === 'desk') {
      this.work(h);
      e.energy = Math.max(0, e.energy - 22 * h);
      e.morale += ((moraleTarget() - e.morale) * .15 - (e.energy < 20 ? 6 : 0)) * h;
      if ((this.thinkT -= dt) <= 0) { this.thinkT = rand(5, 11); if (Math.random() < .45) this.say(pick(ROLES[e.role].bub), 2, true); }
      if (e.energy < 35) this.goBreak();
    } else if (this.task === 'break' || this.task === 'wander') {
      const rate = this.task === 'break' ? this.poi.rate : 25, mor = this.task === 'break' ? this.poi.mor : 0;
      e.energy = Math.min(100, e.energy + rate * h); e.morale = Math.min(100, e.morale + mor * h);
      if ((this.chatT -= dt) <= 0) { this.chatT = rand(6, 12); chitchat(this); }
      if (this.task === 'wander' && (this.wanderT -= dt) <= 0 && e.energy < 90) this.wander();
      if (e.energy >= 92) this.goDesk();
    }
    e.morale = clamp(e.morale, 0, 100);
  }
  work(h) {
    const e = this.emp, eff = effOf(e), board = S.items.board ? 1.1 : 1;
    switch (e.role) {
      case 'dev': S.devProg += eff * h * board; checkRelease(this); break;
      case 'design': S.polish = Math.min(verCost(), S.polish + eff * .9 * h * board); break;
      case 'mkt': S.buzz += eff * .45 * h; break;
      case 'support': S.supportPts += eff * 1.6 * h; break;
      case 'sales':
        this.sp = Math.min(this.sp + eff * .7 * h, 3);
        while (this.sp >= 1 && S.pipeline >= 1) {
          this.sp--; S.pipeline--;
          if (Math.random() < conv()) newCustomer(this); else if (Math.random() < .3) this.say('😕', 1.5, true);
        }
        break;
    }
  }
  move(dt) {
    let step = SPEED * dt;
    while (step > 0 && this.path.length) {
      const [nx, ny] = this.path[0], dx = nx - this.x, dy = ny - this.y, d = Math.hypot(dx, dy);
      if (Math.abs(dx) > Math.abs(dy)) this.dir = dx > 0 ? 'right' : 'left'; else if (d > .001) this.dir = dy > 0 ? 'down' : 'up';
      if (d <= step) { this.x = nx; this.y = ny; this.path.shift(); step -= d; }
      else { this.x += dx / d * step; this.y += dy / d * step; step = 0; }
    }
    this.phase += dt * 11;
    if (!this.path.length) this.arrive();
  }
  status() {
    const e = this.emp;
    if (this.task === 'leave') return '🚪 Leaving';
    if (this.state === 'walking') return this.task === 'desk' ? '🚶 Heading back to the desk' : '🚶 Taking a break';
    if (this.task === 'break') return this.poi.emo + ' ' + this.poi.doing;
    if (this.task === 'wander') return '🧍 Stretching their legs';
    if (e.role === 'sales' && S.pipeline < 1) return '😴 No leads: needs marketing';
    return ROLES[e.role].e + ' ' + ROLES[e.role].verb;
  }
}

const CHATS = [
  ['Seen today\'s numbers?', 'Going up! 📈'], ['Coffee?', 'Always ☕'], ['This bug is driving me nuts', 'Restart and pray 🙏'],
  ['Team lunch on Friday?', 'I\'m in! 🍕'], ['{F} is very motivated today', 'Keeps saying "let\'s scale"…', '😂'],

function chitchat(a) {
  const b = actors.find(o => o !== a && !o.gone && o.state === 'idle' && (o.task === 'break' || o.task === 'wander') && Math.hypot(o.x - a.x, o.y - a.y) < 4.5);
  if (!b || Math.random() < .35) return;
  b.chatT = 8;
  const lines = pick(CHATS).map(l => l.replace('{B}', b.emp.name).replace('{F}', S.founder));
  lines.forEach((l, i) => timers.push({ t: i * 1.9, f: () => (i % 2 ? b : a).say(l, 2.2) }));
}

  } else if (d === 'down') { R(px - 5, by - 4, 4, 5, '#2f3550'); R(px + 1, by - 4, 4, 5, '#2f3550'); }
  RR(px - 6, by - 16, 12, 10, 3, shirt); R(px - 6, by - 8, 12, 2, 'rgba(0,0,0,.12)');
  if (e.founder) R(px - 1, by - 16, 2, 6, ROLES[e.role].c);
  const typing = deskSit ? Math.sin(performance.now() / 70 + e.id) : 0;
  if (d === 'left' || d === 'right') { const s = d === 'right' ? 1 : -1; R(px - 2 + s * swing * .6, by - 15, 4, 8, shirt); R(px - 2 + s * swing * .6, by - 8, 4, 3, e.skin); }
  else { R(px - 9, by - 15 + swing * .5, 3, 8, shirt); R(px + 6, by - 15 - swing * .5, 3, 8, shirt); R(px - 9, by - 8 + swing * .5 + typing, 3, 3, e.skin); R(px + 6, by - 8 - swing * .5 - typing, 3, 3, e.skin); }
  const hx = px - 5.5, hy = by - 26;

  RR(hx, hy, 11, 11, 3, e.skin);
  if (d === 'up') RR(hx - 1, hy - 1, 13, 12, 4, e.hair);
  else {
    RR(hx - 1, hy - 1, 13, 5, 3, e.hair);
    if (d === 'down') { R(hx - 1, hy + 2, 2, e.style === 'long' ? 12 : 4, e.hair); R(hx + 10, hy + 2, 2, e.style === 'long' ? 12 : 4, e.hair); }
    else if (d === 'left') R(hx + 8, hy + 2, 4, e.style === 'long' ? 12 : 5, e.hair); else R(hx - 1, hy + 2, 4, e.style === 'long' ? 12 : 5, e.hair);
    const eh = (performance.now() / 1000 + e.id * 1.7) % 4 < .12 ? .6 : 2;
    if (d === 'down') { R(hx + 2.5, hy + 5.5, 1.6, eh, '#222'); R(hx + 7, hy + 5.5, 1.6, eh, '#222'); R(hx + 4.5, hy + 8.5, 2, .8, '#b0605088'); }
    else if (d === 'left') R(hx + 2, hy + 5.5, 1.6, eh, '#222'); else R(hx + 7.4, hy + 5.5, 1.6, eh, '#222');
  }
  if (e.style === 'bun') C(px, hy - 2, 3.5, e.hair);
  if (e.style === 'curly') { C(hx + 1, hy + 1, 3, e.hair); C(hx + 5.5, hy - 1, 3.2, e.hair); C(hx + 10, hy + 1, 3, e.hair); }
}
function drawLabel(a) {
  const e = a.emp, px = (a.x + .5) * T, y = feetY(a) + 3, txt = (e.founder ? '⭐ ' : '') + e.name;
  ctx.font = '600 7px "Segoe UI","Segoe UI Emoji"'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const w = ctx.measureText(txt).width + 6;
  RR(px - w / 2, y, w, 9, 4, 'rgba(20,22,32,.75)'); R(px - w / 2 + 2, y + 7, w - 4, 1, ROLES[e.role].c);
  ctx.fillStyle = '#fff'; ctx.fillText(txt, px, y + 1);

function wrap(text, max) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > max && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function drawBubble(a) {
  const b = a.bubble, px = (a.x + .5) * T, top = feetY(a) - 30, col = ROLES[a.emp.role].c;
  ctx.globalAlpha = Math.max(0, Math.min(1, b.t * 5, (b.max - b.t) * 8 + .2)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    ctx.font = '10px "Segoe UI Emoji","Segoe UI"'; ctx.fillStyle = '#333'; ctx.fillText(b.text, px, y);
  } else {
    ctx.font = '8px "Segoe UI","Segoe UI Emoji"';
    const lines = wrap(b.text, 118), lw = Math.max(...lines.map(l => ctx.measureText(l).width)), w = lw + 12, h = lines.length * 10 + 7;
    const x = Math.max(T + 2, Math.min(W - T - 2 - w, px - w / 2)), y = Math.max(4, top - h - 2);
    RR(x - 1, y - 1, w + 2, h + 2, 6, col); RR(x, y, w, h, 5, '#fff');
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(px - 4, y + h); ctx.lineTo(px + 4, y + h); ctx.lineTo(px, y + h + 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(px - 3, y + h - 1); ctx.lineTo(px + 3, y + h - 1); ctx.lineTo(px, y + h + 4); ctx.fill();
    ctx.fillStyle = '#25262e'; lines.forEach((l, k) => ctx.fillText(l, x + w / 2, y + 8.5 + k * 10));

function drawPingBall() {

  const [p1, p2] = ITEMS.ping.pois, ok = p => p.busy && p.busy.state === 'idle' && p.busy.task === 'break';
  if (!ok(p1) || !ok(p2)) return;
  const t = (performance.now() / 700) % 2, k = t < 1 ? t : 2 - t;
  const x = (p1.tile[0] + .9 + k * (p2.tile[0] - p1.tile[0] - .8)) * T, y = 15.6 * T - Math.abs(Math.sin(k * Math.PI * 2)) * 10;
  E(x, 15.8 * T, 2, 1, 'rgba(0,0,0,.3)'); C(x, y, 1.8, '#fff7e0');

// =====================================================================
// LOOP
// =====================================================================
function simStep(dt) {
  const mins = dt * minPerSec(), h = mins / 60;
  S.min += mins;
  S.pipeline = Math.min(400, S.pipeline + leadsPerDay() / 9 * h);
  actors.forEach(a => a.update(dt, h));
  actors = actors.filter(a => !a.gone);
  timers.forEach(t => { if ((t.t -= dt) <= 0) t.f(); }); timers = timers.filter(t => t.t > 0);
  floats.forEach(f => { f.t -= dt; f.y -= 14 * dt; }); floats = floats.filter(f => f.t > 0);
  if (S.min >= 18 * 60) endDay();
}
let last = performance.now(), uiT = 0;
function frame(now) {
  const real = Math.min(.05, (now - last) / 1000); last = now;
  if (S) {
    const blocked = paused || !document.getElementById('modal').hidden || !document.getElementById('home').hidden || S.over;
    if (!blocked) simStep(real * speed);
    if (nightT > 0) nightT -= real;
    ctx.clearRect(0, 0, W, H);
    drawRoom();
    DESKS.forEach((_, i) => drawDesk(i));
    activeFurn().forEach(drawFurniture);
    [...actors].sort((a, b) => feetY(a) - feetY(b)).forEach(drawAgent);
    drawPingBall();
    actors.forEach(drawLabel);
    actors.filter(a => a.bubble).forEach(drawBubble);
    floats.forEach(f => { ctx.globalAlpha = Math.min(1, f.t); ctx.font = '700 9px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillStyle = '#0008'; ctx.fillText(f.text, f.x + .7, f.y + .7); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1; });
    if (nightT > 0) {
      const a = Math.min(1, nightT / .6); R(0, 0, W, H, `rgba(10,12,30,${a * .7})`);
      ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.font = '700 26px "Segoe UI"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Day ' + S.day, W / 2, H / 2); ctx.globalAlpha = 1;
    }
    if ((uiT -= real) <= 0) { uiT = .25; if (dirty) render(); else refresh(); }
  }
  requestAnimationFrame(frame);
}
addEventListener('beforeunload', save);
setInterval(save, 15000);
(() => {   // resume the last project, or open the menu
  let lastId = null; try { lastId = localStorage.getItem(STORE + '-last'); } catch { }
  const all = allProjects();
  if (lastId && all[lastId] && !all[lastId].over) loadProject(lastId);
  else { homeTab = Object.keys(all).length ? 'projects' : 'new'; showHome(); }
})();
