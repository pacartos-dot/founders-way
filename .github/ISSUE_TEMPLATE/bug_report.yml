name: 🐞 Bug report
description: Something is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. New game, Founder profile\n2. Open the Team window\n3. ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Edge 130 on Windows 11
  - type: textarea
    id: shots
    attributes:
      label: Screenshot or console error (F12)
